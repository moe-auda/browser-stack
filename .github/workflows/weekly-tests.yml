name: Weekly BrowserStack Tests

# Runs across 4 days while keeping Speed Lab API usage to 4 tests/day.
# All results are ready before the Tuesday 11 AM PT weekly meeting.
#
# Fri  10:00 UTC — iPhone 12                    (4 Speed Lab tests)
# Sat  10:00 UTC — Galaxy S10 + Galaxy S24      (8 local Lighthouse tests)
# Sun  10:00 UTC — OS X Safari                  (4 Automate tests)
# Mon  10:00 UTC — Windows Chrome               (4 local Lighthouse tests)
#
# After each run, results are committed and GitHub Pages updates automatically.

on:
  schedule:
    - cron: '0 10 * * 5'   # Friday    10:00 UTC  (3 AM PDT)
    - cron: '0 10 * * 6'   # Saturday  10:00 UTC  (3 AM PDT)
    - cron: '0 10 * * 0'   # Sunday    10:00 UTC  (3 AM PDT)
    - cron: '0 10 * * 1'   # Monday    10:00 UTC  (3 AM PDT)
  workflow_dispatch:
    inputs:
      day:
        description: 'Which profile to run'
        required: true
        default: 'iphone'
        type: choice
        options:
          - iphone
          - galaxy
          - galaxy-s24
          - android
          - safari
          - chrome
          - all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Ensure Chrome is installed (for Lighthouse)
        if: github.event.schedule == '0 10 * * 6' || github.event.schedule == '0 10 * * 1' || (github.event_name == 'workflow_dispatch' && (inputs.day == 'galaxy' || inputs.day == 'galaxy-s24' || inputs.day == 'android' || inputs.day == 'chrome' || inputs.day == 'all'))
        run: google-chrome --version 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y google-chrome-stable)

      - name: Run tests — Friday (iPhone 12)
        if: github.event.schedule == '0 10 * * 5' || (github.event_name == 'workflow_dispatch' && inputs.day == 'iphone')
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: node run-tests.js --iphone

      - name: Run tests — Saturday (Galaxy S10 + Galaxy S24)
        if: github.event.schedule == '0 10 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.day == 'android')
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        # Both Android profiles use local Lighthouse, so this consumes no Speed Lab quota.
        run: node run-tests.js --android

      - name: Run tests — Samsung Galaxy S10 (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.day == 'galaxy'
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: node run-tests.js --galaxy

      - name: Run tests — Samsung Galaxy S24 (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.day == 'galaxy-s24'
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: node run-tests.js --galaxy-s24

      - name: Run tests — Sunday (OS X Big Sur Safari)
        if: github.event.schedule == '0 10 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.day == 'safari')
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: node run-tests.js --safari

      - name: Run tests — Monday (Windows 11 Chrome)
        if: github.event.schedule == '0 10 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.day == 'chrome')
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: node run-tests.js --chrome

      - name: Run all tests (manual override)
        if: github.event_name == 'workflow_dispatch' && inputs.day == 'all'
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: node run-tests.js

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "chore: test results $(date +%Y-%m-%d)"
          git push
